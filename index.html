<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAKIM Ω</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color-scheme:light}
body{margin:0;background:#f5f7fb;color:#172033}
main{max-width:720px;margin:auto;padding:24px 16px 48px}
.card{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(20,32,55,.06)}
h1{font-size:1.5rem;margin:0 0 6px}.sub{color:#667085;margin:0 0 18px;line-height:1.7}
label{display:block;font-weight:700;margin:14px 0 6px}textarea,input{width:100%;box-sizing:border-box;border:1px solid #cfd6e4;border-radius:12px;padding:12px;font-size:1rem;background:#fff}textarea{min-height:130px;resize:vertical}
button,a.download{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px 16px;font-size:1rem;font-weight:800;text-align:center;text-decoration:none;margin-top:12px}button{background:#155eef;color:#fff}button:disabled{opacity:.55}a.download{background:#087443;color:#fff}.status{margin-top:16px;padding:12px;border-radius:12px;background:#eef4ff;line-height:1.8;white-space:pre-wrap}.hidden{display:none}.muted{color:#667085;font-size:.9rem}.error{background:#fff1f0;color:#9b1c1c}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>HAKIM Ω</h1>
    <p class="sub">اكتب طلبك كما هو. النظام يحتفظ بالمهمة ويعرض لك النتيجة النهائية فقط.</p>

    <label for="token">رمز الدخول</label>
    <input id="token" type="password" autocomplete="current-password" placeholder="أدخله مرة واحدة في هذه الجلسة">
    <p class="muted">يُحفظ داخل هذه الجلسة فقط ولا يُرسل إلا إلى خادم HAKIM.</p>

    <label for="prompt">ماذا تريد؟</label>
    <textarea id="prompt" placeholder="مثال: أنشئ درس الجمع ضمن ١٠ كملف PDF"></textarea>
    <button id="submit">إنشاء</button>

    <div id="status" class="status hidden"></div>
    <a id="download" class="download hidden">تنزيل الملف</a>
  </div>
</main>
<script>
const tokenEl=document.getElementById('token');
const promptEl=document.getElementById('prompt');
const submitEl=document.getElementById('submit');
const statusEl=document.getElementById('status');
const downloadEl=document.getElementById('download');
tokenEl.value=sessionStorage.getItem('omega_token')||'';
let currentTask=null;
function authHeaders(){const token=tokenEl.value.trim(); if(!token) throw new Error('أدخل رمز الدخول.'); sessionStorage.setItem('omega_token',token); return {'Authorization':'Bearer '+token,'Content-Type':'application/json'};}
function show(message,isError=false){statusEl.textContent=message;statusEl.classList.remove('hidden','error');if(isError)statusEl.classList.add('error');}
function stateText(task){const map={queued:'تم استلام المهمة وهي في الانتظار.',running:'يجري تنفيذ المهمة الآن.',completed:task.verified?'اكتملت المهمة وتم التحقق من الناتج.':'اكتملت المهمة، لكن الناتج غير موسوم كمتحقق.',failed:'تعذر إكمال المهمة.'};return map[task.status]||('الحالة: '+task.status);}
async function poll(taskId){currentTask=taskId;for(;;){const res=await fetch('/tasks/'+encodeURIComponent(taskId),{headers:{'Authorization':'Bearer '+tokenEl.value.trim()},cache:'no-store'});if(!res.ok){throw new Error('تعذر قراءة حالة المهمة.');}const task=await res.json();show(stateText(task)+(task.error?'\n'+task.error:''));if(task.status==='completed'){if(task.artifact){downloadEl.href=task.artifact.url;downloadEl.classList.remove('hidden');downloadEl.onclick=async ev=>{ev.preventDefault();const r=await fetch(task.artifact.url,{headers:{'Authorization':'Bearer '+tokenEl.value.trim()}});if(!r.ok){show('تعذر تنزيل الملف.',true);return;}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=task.artifact.name||'result';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}submitEl.disabled=false;return;}if(task.status==='failed'){submitEl.disabled=false;return;}await new Promise(r=>setTimeout(r,1200));}}
submitEl.onclick=async()=>{downloadEl.classList.add('hidden');try{const prompt=promptEl.value.trim();if(!prompt)throw new Error('اكتب طلبك أولًا.');submitEl.disabled=true;show('يتم إرسال المهمة…');const idem=crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random());const res=await fetch('/tasks',{method:'POST',headers:{...authHeaders(),'Idempotency-Key':idem},body:JSON.stringify({prompt})});const task=await res.json();if(!res.ok)throw new Error(task.message||'تعذر إنشاء المهمة.');show(stateText(task));await poll(task.task_id);}catch(err){show(err.message||String(err),true);submitEl.disabled=false;}};
</script>
</body>
</html>
