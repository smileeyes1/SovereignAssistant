name: HAKIM Phone Relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  relay:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'HAKIM_RELAY ')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Forward signed envelope to HAKIM outbound-only topic
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os, urllib.request
          prefix = "HAKIM_RELAY "
          body = os.environ.get("COMMENT_BODY", "")
          if not body.startswith(prefix):
              raise SystemExit("bad prefix")
          message = body[len(prefix):].strip()
          if not (8 <= len(message) <= 65536):
              raise SystemExit("bad message length")
          req = urllib.request.Request(
              "https://ntfy.sh/hakim-arGZikq4704EyjrBrOBjM3pZRC1PjI",
              data=message.encode("utf-8"),
              headers={"Content-Type": "text/plain; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"ntfy status {response.status}")
          print("HAKIM_RELAY_SENT")
          PY
