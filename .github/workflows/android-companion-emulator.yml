name: HAKIM Android Companion Emulator Qualification

on:
  pull_request:
    paths:
      - 'android/hakim-companion/**'
      - 'scripts/pair-android-companion.sh'
      - 'scripts/hakim-companion-status.sh'
      - 'scripts/install-android-companion-local.sh'
      - 'tests/test_android_companion_contract.py'
      - '.github/workflows/android-companion.yml'
      - '.github/workflows/android-companion-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

# This is a pre-field Android runtime gate, not evidence that the physical
# TECNO/HiOS target is field-qualified. Device-only signing material is never
# used here; the CI debug key is intentionally disposable.
jobs:
  android-15-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build disposable debug APK
        working-directory: android/hakim-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 runtime smoke and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK=android/hakim-companion/app/build/outputs/apk/debug/app-debug.apk
            PKG=org.hakim.omega.companion
            adb install -r "$APK"
            adb shell pm path "$PKG" | grep '^package:'
            adb shell am start -W -n "$PKG/.MainActivity"
            adb shell dumpsys activity activities | grep -F "$PKG" >/dev/null

            # Process death must not corrupt installability or relaunch.
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/.MainActivity"
            adb shell pidof "$PKG" >/dev/null

            # The Companion itself must never package or spawn a resident local LLM.
            if adb shell ps -A | grep -E 'llama-server|llama\.cpp' ; then
              echo 'Unexpected resident local-model process' >&2
              exit 1
            fi

            # Reboot smoke: package and launcher remain recoverable after Android restart.
            adb reboot
            adb wait-for-device
            boot=''
            for i in $(seq 1 90); do
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              [ "$boot" = '1' ] && break
              sleep 2
            done
            [ "$boot" = '1' ]
            adb shell pm path "$PKG" | grep '^package:'
            adb shell am start -W -n "$PKG/.MainActivity"
            adb shell pidof "$PKG" >/dev/null

            echo 'EMULATOR_RUNTIME=PROVEN'
            echo 'PHYSICAL_TECNO_FIELD_QUALIFICATION=NOT_PROVEN'
