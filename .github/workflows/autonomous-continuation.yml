name: Ω APEX Immediate Autonomous Continuation

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: ["HAKIM Governance Gate", "HAKIM Continuity Shield"]
    types: [completed]
  workflow_dispatch:
  schedule:
    # External deadman/watchdog only. Primary continuation remains same-cycle/event-driven.
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: omega-apex-immediate-continuation
  cancel-in-progress: false

jobs:
  continue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != null)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMEGA_REPOSITORY: ${{ github.repository }}
      OMEGA_GITHUB_TOKEN: ${{ github.token }}
      OMEGA_GITHUB_WEBHOOK_SECRET: event-bridge-local-only
      OMEGA_RUNTIME_TOKEN: event-bridge-local-only
      OMEGA_DB_PATH: ${{ github.workspace }}/.omega/omega.db
      OMEGA_CONTINUITY_SNAPSHOT_DIR: ${{ github.workspace }}/.omega/cloud-continuity
      OMEGA_CONTINUITY_RETENTION: '8'
      OMEGA_ALLOW_BRANCH_CREATE: 'true'
      OMEGA_ALLOW_COMMENT: 'true'
      OMEGA_ALLOW_MERGE: 'false'
      # Deterministic infra-only recovery remains available even without any model.
      OMEGA_ALLOW_PROVIDERLESS_CI_RERUN: 'true'
      OMEGA_ALLOW_FILE_WRITE: ${{ secrets.OMEGA_OPENAI_API_KEY != '' && secrets.OMEGA_OPENAI_MODEL != '' }}
      OMEGA_OPENAI_API_KEY: ${{ secrets.OMEGA_OPENAI_API_KEY }}
      OMEGA_OPENAI_MODEL: ${{ secrets.OMEGA_OPENAI_MODEL }}
      OMEGA_OPENAI_BASE_URL: ${{ secrets.OMEGA_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore durable autonomy state
        uses: actions/cache/restore@v4
        with:
          path: .omega
          key: omega-apex-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            omega-apex-state-v2-
            omega-apex-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ω APEX
        run: python -m pip install .

      - name: Verify or recover cloud continuity state
        run: python -m app.hakim.run_cloud_continuity prepare

      - name: Process event immediately
        run: python -m app.hakim.run_event_once

      - name: Seal verified cloud continuity snapshot
        id: continuity_seal
        if: always()
        run: python -m app.hakim.run_cloud_continuity seal

      - name: Save durable autonomy state
        if: always() && steps.continuity_seal.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .omega
          key: omega-apex-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enforce no-silent-stall capability gate
        if: env.OMEGA_ALLOW_FILE_WRITE != 'true'
        run: |
          echo 'Mission liveness watchdog remains active; deterministic transient-CI recovery is enabled.'
          echo 'Autonomous source generation remains fail-closed until an approved coding provider is configured.'
          echo 'Unfinished roadmap work MUST remain BLOCKED with evidence; it must never be reported as idle or complete.'
