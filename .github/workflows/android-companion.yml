name: HAKIM Android Companion Build

on:
  pull_request:
    paths:
      - 'android/hakim-companion/**'
      - 'scripts/pair-android-companion.sh'
      - 'scripts/hakim-companion-status.sh'
      - 'tests/test_android_companion_contract.py'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Contract tests
        run: python -m pytest -q tests/test_android_companion_contract.py
      - name: Build installable debug APK
        working-directory: android/hakim-companion
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hakim-companion-debug-apk
          path: android/hakim-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
