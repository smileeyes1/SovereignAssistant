name: HAKIM Temporary apksig Tooling Export

on:
  pull_request:
    paths:
      - '.github/workflows/extract-apksig-tooling.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve Android build tooling
        working-directory: android/hakim-companion
        run: gradle --no-daemon :app:assembleDebug >/dev/null
      - name: Collect official apksig library
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/apksig" -type f -name 'apksig-*.jar' | sort -V | tail -1)
          test -n "$jar"
          mkdir -p /tmp/hakim-apksig
          cp "$jar" /tmp/hakim-apksig/apksig.jar
          sha256sum /tmp/hakim-apksig/apksig.jar > /tmp/hakim-apksig/apksig.jar.sha256
          printf 'source=%s\n' "$jar" > /tmp/hakim-apksig/source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hakim-official-apksig-tooling
          path: /tmp/hakim-apksig/
          if-no-files-found: error
          retention-days: 1
