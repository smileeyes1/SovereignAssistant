name: HAKIM Android Companion Release

on:
  push:
    branches: [main, hakim-playprotect-safe]
    paths:
      - 'android/hakim-companion/**'
      - 'scripts/install-android-companion-local.sh'
      - 'tests/test_android_zero_cost_transport_contract.py'
      - '.github/workflows/android-companion-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zero-cost independence contract
        run: python -m pytest -q tests/test_android_zero_cost_transport_contract.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: android/hakim-companion
        run: gradle --no-daemon :app:assembleRelease
      - name: Stage build, hash, and official apksig tool
        shell: bash
        run: |
          set -euo pipefail
          cp android/hakim-companion/app/build/outputs/apk/release/app-release-unsigned.apk hakim-companion-unsigned.apk
          sha256sum hakim-companion-unsigned.apk > hakim-companion-unsigned.apk.sha256
          APKSIG_JAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/apksig" -type f -name 'apksig-*.jar' | head -n 1)"
          test -n "$APKSIG_JAR"
          cp "$APKSIG_JAR" apksig.jar
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakim-companion-unsigned-${{ github.sha }}
          path: |
            hakim-companion-unsigned.apk
            hakim-companion-unsigned.apk.sha256
            apksig.jar
          if-no-files-found: error
      - name: Publish immutable source-build release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="hakim-companion-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HAKIM Companion ${GITHUB_SHA::12}" \
            --notes "Unsigned Android Companion built from verified source branch. Sign locally with the owned HAKIM key; no repository signing key exists." \
            hakim-companion-unsigned.apk \
            hakim-companion-unsigned.apk.sha256
