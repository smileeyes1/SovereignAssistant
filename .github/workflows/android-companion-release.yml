name: HAKIM Android Companion Release

on:
  push:
    branches: [main, hakim-playprotect-safe, hakim-zero-cost-independent]
    paths:
      - 'android/hakim-companion/**'
      - 'scripts/install-android-companion-local.sh'
      - 'scripts/android-companion-emulator-*.sh'
      - 'tests/test_android_*.py'
      - 'tests/test_hakim_*bridge*.py'
      - 'tests/test_hakim_encrypted_carrier_contract.py'
      - 'governance/HAKIM_*POLICY*.json'
      - 'governance/HAKIM_PHONE_SOVEREIGN_CONSTRAINTS.json'
      - 'governance/HAKIM_ACTIVE_STATE.json'
      - '.github/workflows/android-companion-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test tooling
        run: python -m pip install --disable-pip-version-check pytest
      - name: Sovereign-local release contract suite
        run: >-
          python -m pytest -q
          tests/test_android_zero_cost_transport_contract.py
          tests/test_android_action_idempotency_contract.py
          tests/test_android_companion_contract.py
          tests/test_android_financial_safe_mode_contract.py
          tests/test_android_notification_emulator_gate_contract.py
          tests/test_android_airplane_emulator_gate_contract.py
          tests/test_hakim_encrypted_carrier_contract.py
          tests/test_hakim_secure_bridge_policy_contract.py
          tests/test_live_bridge_contract.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Clean-build unsigned release APK
        working-directory: android/hakim-companion
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Verify built APK contains no stale external relay runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="android/hakim-companion/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$APK" -d "$TMP"
          strings_all() { find "$TMP" -type f -print0 | xargs -0 strings 2>/dev/null || true; }
          strings_all > "$TMP/all.strings"
          for marker in \
            'ntfy.sh' \
            'hook.eu1.make.com' \
            'TinyFish' \
            'HakimRemoteRelay' \
            'relay_topic' \
            'relay_result_topic' \
            'relay_base_url' \
            'relay_hmac_key'
          do
            if grep -Fq "$marker" "$TMP/all.strings"; then
              echo "Forbidden stale transport marker found in built APK: $marker" >&2
              exit 21
            fi
          done
          for marker in 'local_proof' 'HAKIM-TASK-v1' 'hakim.local' 'SOVEREIGN_LOCAL'; do
            grep -Fq "$marker" "$TMP/all.strings" || {
              echo "Required sovereign-local marker missing from built APK: $marker" >&2
              exit 22
            }
          done
      - name: Stage build, hash, and official apksig tool
        shell: bash
        run: |
          set -euo pipefail
          cp android/hakim-companion/app/build/outputs/apk/release/app-release-unsigned.apk hakim-companion-unsigned.apk
          sha256sum hakim-companion-unsigned.apk > hakim-companion-unsigned.apk.sha256
          APKSIG_JAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools.build/apksig" -type f -name 'apksig-*.jar' | head -n 1)"
          test -n "$APKSIG_JAR"
          cp "$APKSIG_JAR" apksig.jar
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakim-companion-unsigned-${{ github.sha }}
          path: |
            hakim-companion-unsigned.apk
            hakim-companion-unsigned.apk.sha256
            apksig.jar
          if-no-files-found: error
      - name: Publish immutable source-build release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="hakim-companion-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HAKIM Companion ${GITHUB_SHA::12}" \
            --notes "Unsigned Android Companion built from a clean verified source tree. Sovereign-local source tests plus built-binary gates reject stale external relay runtime. Sign locally with the owned HAKIM key; no repository signing key exists." \
            hakim-companion-unsigned.apk \
            hakim-companion-unsigned.apk.sha256
