name: HAKIM Android Companion Release

on:
  push:
    branches: [main, hakim/sovereign-local-mainline-v1]
    paths:
      - 'android/hakim-companion/**'
      - 'scripts/install-android-companion-local.sh'
      - 'tests/test_android_sovereign_local_mainline_contract.py'
      - '.github/workflows/android-companion-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sovereign-local contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_android_sovereign_local_mainline_contract.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: android/hakim-companion
        run: gradle --no-daemon :app:assembleRelease
      - name: Stage and hash unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/hakim-companion/app/build/outputs/apk/release/app-release-unsigned.apk hakim-companion-unsigned.apk
          sha256sum hakim-companion-unsigned.apk > hakim-companion-unsigned.apk.sha256
      - name: Verify APK archive and record build provenance
        shell: bash
        run: |
          set -euo pipefail
          unzip -t hakim-companion-unsigned.apk >/dev/null
          APK_SHA="$(sha256sum hakim-companion-unsigned.apk | awk '{print $1}')"
          RECORDED_SHA="$(awk '{print $1}' hakim-companion-unsigned.apk.sha256)"
          test "$APK_SHA" = "$RECORDED_SHA"
          ANDROID_TREE_SHA="$(git rev-parse HEAD:android/hakim-companion)"
          export APK_SHA ANDROID_TREE_SHA
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              "schema_version": "1.0",
              "status": "UNSIGNED_SOURCE_BUILD_VERIFIED",
              "source_commit_sha": os.environ["GITHUB_SHA"],
              "android_tree_sha": os.environ["ANDROID_TREE_SHA"],
              "apk_sha256": os.environ["APK_SHA"],
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "ref_name": os.environ.get("GITHUB_REF_NAME", ""),
              "artifact": "hakim-companion-unsigned.apk",
              "signing_state": "UNSIGNED",
              "required_final_signing": "LOCAL_DEVICE_OWNED_KEY_ONLY",
              "field_verification": "NOT_PROVEN_BY_BUILD",
          }
          Path("hakim-companion-build-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakim-companion-unsigned-${{ github.sha }}
          path: |
            hakim-companion-unsigned.apk
            hakim-companion-unsigned.apk.sha256
            hakim-companion-build-manifest.json
          if-no-files-found: error
      - name: Publish immutable source-build release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="hakim-companion-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HAKIM Companion ${GITHUB_SHA::12}" \
            --notes "Unsigned Android Companion built from verified main. Archive integrity and source provenance are recorded in the attached manifest. Sign locally with the owned HAKIM key; no repository signing key exists. Build success is not physical field verification." \
            hakim-companion-unsigned.apk \
            hakim-companion-unsigned.apk.sha256 \
            hakim-companion-build-manifest.json
